<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha del proyecto &middot; Beta &middot; MONPICA</title>
<meta name="description" content="Beta navegable del sistema de gestión de proyectos de MONPICA — Montilla Proyectos Integrales C.A. Datos de ejemplo.">
<link rel="icon" type="image/png" href="assets/marca/favicon.png">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<!-- seed, store y auth van en el head: la guarda de permisos debe correr
     ANTES de pintar. Si el rol no puede ver esta pagina, auth.js redirige. -->
<script src="assets/seed.js"></script>
<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
</head>
<body class="pi-verificando">
<main class="pi-lienzo">
  <div id="pi-ficha"></div>
  <div id="pi-pestanas"></div>
  <div id="pi-contenido"></div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/shell.js"></script>
<script>

PI.listo(function () {
  var S = PI.store, U = PI.ui, A = PI.auth, F = PI.fmt;
  var cat = S.catalogos(), yo = S.usuario(), rol = A.rol();
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id') || (S.proyectosVisibles(yo.id, rol)[0] || {}).id;
  var p = S.buscarProyecto(id);
  var cont = document.getElementById('pi-contenido');

  /* --- El proyecto debe existir y ser visible para este rol --------------- */
  if (!p) {
    document.getElementById('pi-ficha').innerHTML =
      '<div class="tarjeta">' + U.vacio({ icono: 'error', titulo: 'Proyecto no encontrado',
        texto: 'El expediente solicitado no existe en los datos de ejemplo.',
        accion: '<a class="btn btn-primario" href="proyectos.html">Volver al listado</a>' }) + '</div>';
    return;
  }
  if (!S.proyectosVisibles(yo.id, rol).some(function (x) { return x.id === p.id; })) {
    window.location.replace('sin-permiso.html?pagina=proyecto.html&rol=' + encodeURIComponent(rol));
    return;
  }

  var pestanas = A.pestanasVisibles(rol);
  var tab = params.get('tab') || 'resumen';
  if (!pestanas.some(function (t) { return t.id === tab; })) tab = 'resumen';

  function url(t) { return 'proyecto.html?id=' + encodeURIComponent(p.id) + '&tab=' + t; }
  function ir(t) { window.location.href = url(t); }
  function recargar() { window.location.reload(); }

  /* ======================================================================
     Cabecera de la ficha
     ==================================================================== */
  function ficha() {
    var c = S.buscarContratante(p.contratanteId);
    var venc = S.etapasVencidas(p), espera = S.esperandoAprobacion(p);
    var act = S.etapaActual(p);
    return '<div class="tarjeta" style="margin-bottom:16px"><div class="tarjeta-cuerpo">' +
      '<div class="pi-cabecera-fila">' +
      '<div style="flex:1;min-width:260px">' +
      '<div class="fila" style="gap:8px;margin-bottom:6px">' +
      '<span class="badge badge-info sin-punto">' + U.esc(p.id) + '</span>' +
      U.badge(p.estado) +
      (venc.length ? '<span class="badge badge-mal">' + venc.length + (venc.length === 1 ? ' etapa vencida' : ' etapas vencidas') + '</span>' : '') +
      (espera.length ? '<span class="badge badge-aviso">Compuerta en espera</span>' : '') +
      '</div>' +
      '<h1>' + U.esc(p.nombre) + '</h1>' +
      '<p class="suave sm" style="margin-top:6px">' +
      U.icono('domain', 'icono-sm') + ' ' + U.esc(c ? c.nombre : '—') + ' &nbsp;·&nbsp; ' +
      U.icono('person', 'icono-sm') + ' ' + U.esc(S.nombreUsuario(p.coordinadorId)) + ' &nbsp;·&nbsp; ' +
      U.icono('location_on', 'icono-sm') + ' ' + U.esc(p.ubicacion || 'sin ubicación') + '</p>' +
      '</div>' +
      '<div class="fila" style="gap:20px;align-items:center">' +
      '<div style="text-align:right"><span class="eti">Avance</span>' +
      '<div class="kpi-val" style="font-size:26px">' + S.avance(p) + '<small>%</small></div>' +
      '<span class="sm tenue">' + (act ? 'etapa ' + act.num + ' de 10' : '10 de 10') + '</span></div>' +
      '<div style="text-align:right"><span class="eti">Entrega prevista</span>' +
      '<div class="mono" style="font-size:15px">' + U.esc(p.fechaFin) + '</div>' +
      '<span class="sm ' + (S.diasHasta(p.fechaFin) < 0 && p.estado !== 'Cerrado' ? '' : 'tenue') + '"' +
      (S.diasHasta(p.fechaFin) < 0 && p.estado !== 'Cerrado' ? ' style="color:var(--error);font-weight:600"' : '') + '>' +
      U.esc(p.estado === 'Cerrado' ? 'proyecto cerrado' : F.plazo(p.fechaFin)) + '</span></div>' +
      '</div></div></div></div>';
  }

  function barraPestanas() {
    return '<div class="pestanas">' + pestanas.map(function (t) {
      return '<a href="' + url(t.id) + '"' + (t.id === tab ? ' aria-current="page"' : '') + '>' +
        U.icono(t.iconoReal || t.icono, 'icono-sm') + ' ' + U.esc(t.titulo) + '</a>';
    }).join('') + '</div>';
  }

  /* ======================================================================
     Pestaña 5: Resumen
     ==================================================================== */
  function vistaResumen() {
    var t = S.totalesFinancieros(p);
    var venc = S.etapasVencidas(p);
    var puedeFin = A.puede('verFinanzas');
    var html = '<div class="kpis">' +
      U.kpi({ titulo: 'Avance', icono: 'trending_up', tono: venc.length ? 'alerta' : 'ok',
        valor: S.avance(p) + '<small>%</small>',
        pie: p.etapas.filter(function (e) { return e.estado === 'Aprobada'; }).length + ' de 10 etapas aprobadas' }) +
      U.kpi({ titulo: 'Presupuesto contratado', icono: 'account_balance_wallet',
        valor: F.dineroCorto(p.presupuesto), pie: 'en dólares' }) +
      (puedeFin
        ? U.kpi({ titulo: 'Ejecutado', icono: 'payments',
            valor: F.dineroCorto(t.egresos),
            pie: p.presupuesto ? F.porcentaje(t.egresos / p.presupuesto * 100) + ' del contratado' : '—' })
        : U.kpi({ titulo: 'Equipo', icono: 'groups', valor: F.numero(p.equipo.length), pie: 'profesionales asignados' })) +
      U.kpi({ titulo: 'Etapas vencidas', icono: 'event_busy', tono: venc.length ? 'alerta' : '',
        valor: F.numero(venc.length), pie: venc.length ? 'fuera de plazo' : 'todo en plazo' }) +
      '</div><div style="height:24px"></div>';

    html += '<div class="tarjeta"><div class="tarjeta-cab"><h2>Recorrido de las 10 etapas</h2>' +
      '<a class="btn btn-sm btn-plano pi-acciones" href="' + url('etapas') + '">Ver detalle</a></div>' +
      '<div class="tarjeta-cuerpo"><div class="etapas-tira">' + tiraEtapas() + '</div></div></div>';

    html += '<div style="height:24px"></div><div class="rejilla rejilla-2">';

    html += '<div class="tarjeta"><div class="tarjeta-cab"><h2>Datos del expediente</h2></div>' +
      '<div class="tarjeta-cuerpo pila-sm">';
    var c = S.buscarContratante(p.contratanteId);
    [['Código', p.id], ['Tipo', p.tipo], ['Estado', p.estado],
     ['Contratante', c ? c.nombre : '—'], ['RIF', c ? c.rif : '—'],
     ['Contacto', c ? c.contacto + ' — ' + c.telefono : '—'],
     ['Coordinador', S.nombreUsuario(p.coordinadorId)],
     ['Inicio', p.fechaInicio], ['Entrega prevista', p.fechaFin],
     ['Ubicación', p.ubicacion || '—']
    ].forEach(function (f) {
      html += '<div class="fila" style="gap:12px;align-items:baseline;border-bottom:1px solid var(--borde-fino);padding-bottom:6px">' +
        '<span class="eti" style="min-width:140px">' + U.esc(f[0]) + '</span>' +
        '<span style="flex:1" class="sm">' + U.esc(f[1]) + '</span></div>';
    });
    html += '</div></div>';

    html += '<div class="tarjeta"><div class="tarjeta-cab"><h2>Contenido del expediente</h2></div>' +
      '<div class="tarjeta-cuerpo rejilla rejilla-2">' +
      [['Documentos', p.documentos.length, 'folder', 'documentos'],
       ['Mediciones de campo', p.mediciones.length, 'forest', 'mediciones'],
       ['Profesionales', p.equipo.length, 'groups', 'equipo'],
       ['Movimientos', puedeFin ? p.finanzas.length : '—', 'payments', puedeFin ? 'finanzas' : 'resumen']
      ].map(function (x) {
        return '<a class="pozo" style="text-decoration:none;color:inherit;display:block" href="' + url(x[3]) + '">' +
          '<div class="fila" style="gap:8px">' + U.icono(x[2]) + '<span class="eti">' + U.esc(x[0]) + '</span></div>' +
          '<div class="kpi-val" style="font-size:24px;margin-top:4px">' + U.esc(x[1]) + '</div></a>';
      }).join('') + '</div></div>';

    html += '</div>';
    return html;
  }

  function tiraEtapas() {
    return p.etapas.map(function (e) {
      var clase = e.estado === 'Aprobada' ? 'ok'
        : e.estado === 'Esperando aprobacion' || e.estado === 'Esperando aprobación' ? 'espera'
        : e.estado === 'Devuelta' ? 'mal'
        : e.estado === 'En proceso' ? 'proceso'
        : e.estado === 'Bloqueada' ? 'bloqueada' : '';
      if (S.etapaVencida(e)) clase = 'mal';
      return '<div class="etapa-mini ' + clase + (e.compuerta ? ' compuerta' : '') + '">' +
        '<div class="fila" style="justify-content:space-between">' +
        '<span class="n">' + String(e.num).padStart(2, '0') + '</span>' +
        (e.estado === 'Aprobada' ? U.icono('check_circle', 'icono-sm')
          : e.estado === 'Bloqueada' ? U.icono('lock', 'icono-sm')
          : e.compuerta ? U.icono('gavel', 'icono-sm') : '') + '</div>' +
        '<div class="t">' + U.esc(e.nombre) + '</div>' +
        '<div class="sm tenue mono">' + U.esc(e.fechaFin) + '</div>' +
        '<div style="margin-top:6px">' + U.badgeEtapa(e) + '</div></div>';
    }).join('');
  }

  /* ======================================================================
     Pestaña 6: Etapas
     ==================================================================== */
  function vistaEtapas() {
    var html = '<div class="tarjeta"><div class="tarjeta-cab"><h2>Flujo de las 10 etapas</h2>' +
      '<span class="badge badge-neutro sin-punto pi-acciones">La etapa 6 es la compuerta</span></div>' +
      '<div class="tarjeta-cuerpo"><div class="etapas-tira">' + tiraEtapas() + '</div></div></div>' +
      '<div style="height:24px"></div>';

    html += '<div class="pila">';
    p.etapas.forEach(function (e) {
      var abierta = e.estado !== 'Aprobada' && e.estado !== 'Bloqueada';
      if (!abierta && !e.comentario) return;
      html += panelEtapa(e);
    });
    html += '</div>';

    html += '<div style="height:24px"></div><div class="tarjeta"><div class="tarjeta-cab"><h2>Todas las etapas</h2></div>' +
      '<div class="tabla-envoltura"><table class="tabla responsiva"><thead><tr>' +
      '<th>#</th><th>Etapa</th><th>Responsable</th><th>Plazo</th><th>Estado</th><th class="derecha">Acción</th>' +
      '</tr></thead><tbody>';
    p.etapas.forEach(function (e) {
      html += '<tr' + (S.etapaVencida(e) ? ' class="alerta"' : '') + '>' +
        '<td data-eti="#" class="mono">' + String(e.num).padStart(2, '0') + '</td>' +
        '<td data-eti="Etapa"><span class="principal">' + U.esc(e.nombre) + '</span>' +
        (e.compuerta ? '<span class="sub">compuerta de aprobación</span>' : '') + '</td>' +
        '<td data-eti="Responsable" class="sm">' + U.esc(e.responsableId ? S.nombreUsuario(e.responsableId) : '—') + '</td>' +
        '<td data-eti="Plazo" class="mono">' + U.esc(e.fechaFin) + '<span class="sub">' + U.esc(F.plazoEtapa(e)) + '</span></td>' +
        '<td data-eti="Estado">' + U.badgeEtapa(e) + '</td>' +
        '<td data-eti="" class="acciones">' + accionesEtapa(e, true) + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    return html;
  }

  function accionesEtapa(e, compacto) {
    var b = [];
    var clase = compacto ? 'btn btn-sm' : 'btn';
    var esEspera = e.estado === 'Esperando aprobacion' || e.estado === 'Esperando aprobación';
    var mia = e.responsableId === yo.id;

    if (esEspera && A.puede('aprobarEtapa')) {
      b.push('<button type="button" class="' + clase + ' btn-primario" data-aprobar="' + e.num + '">Aprobar</button>');
      b.push('<button type="button" class="' + clase + '" data-devolver="' + e.num + '">Devolver</button>');
    } else if ((e.estado === 'En proceso' || e.estado === 'Devuelta' || e.estado === 'Pendiente')) {
      if (A.puede('completarEtapa') && (rol !== 'profesional' || mia)) {
        b.push('<button type="button" class="' + clase + ' ' + (compacto ? '' : 'btn-primario') + '" data-completar="' + e.num + '">' +
          (e.compuerta ? 'Enviar a aprobación' : 'Marcar completada') + '</button>');
      }
    }
    if (!b.length && e.estado === 'Bloqueada') return '<span class="sm tenue">bloqueada</span>';
    if (!b.length && e.estado === 'Aprobada') return '<span class="sm tenue">' + U.esc(e.fechaAprobacion || '') + '</span>';
    if (!b.length) return '<span class="sm tenue">sin acción para tu rol</span>';
    return b.join(' ');
  }

  function panelEtapa(e) {
    var esEspera = e.estado === 'Esperando aprobacion' || e.estado === 'Esperando aprobación';
    var tono = S.etapaVencida(e) ? 'mal' : (esEspera ? '' : (e.estado === 'Devuelta' ? 'mal' : ''));
    return '<div class="tarjeta etapa-panel ' + tono + '"><div class="tarjeta-cab">' +
      '<span class="mono" style="font-size:15px">Etapa ' + String(e.num).padStart(2, '0') + '</span>' +
      '<h2 style="flex:1">' + U.esc(e.nombre) + '</h2>' + U.badgeEtapa(e) + '</div>' +
      '<div class="tarjeta-cuerpo">' +
      '<div class="fila" style="gap:24px;margin-bottom:12px">' +
      '<div><span class="eti">Responsable</span><div class="sm">' + U.esc(e.responsableId ? S.nombreUsuario(e.responsableId) : '—') + '</div></div>' +
      '<div><span class="eti">Plazo</span><div class="mono">' + U.esc(e.fechaFin) + ' <span class="sm ' +
      (S.etapaVencida(e) ? '' : 'tenue') + '"' + (S.etapaVencida(e) ? ' style="color:var(--error);font-weight:600"' : '') + '>' +
      U.esc(F.plazoEtapa(e)) + '</span></div></div>' +
      (e.compuerta ? '<div><span class="eti">Tipo</span><div class="sm">Compuerta de aprobación</div></div>' : '') +
      '</div>' +
      (e.comentario
        ? '<div class="aviso ' + (e.estado === 'Devuelta' ? 'aviso-mal' : '') + '">' + U.icono('info') +
          '<div><strong>' + (e.estado === 'Devuelta' ? 'Devuelta con observaciones' : 'Comentario') + '</strong>' +
          U.esc(e.comentario) + '</div></div>'
        : '') +
      '</div><div class="pi-modal-pie">' + accionesEtapa(e, false) + '</div></div>';
  }

  function conectarEtapas() {
    Array.prototype.forEach.call(cont.querySelectorAll('[data-completar]'), function (b) {
      b.addEventListener('click', function () {
        var n = Number(b.getAttribute('data-completar'));
        var e = p.etapas[n - 1];
        U.confirmar({
          titulo: e.compuerta ? 'Enviar la etapa a aprobación' : 'Marcar la etapa como completada',
          texto: e.compuerta
            ? 'La etapa ' + n + ' queda esperando la revisión del Coordinador. El proyecto pasa a Detenido hasta que se apruebe.'
            : 'La etapa ' + n + ' queda aprobada y se desbloquea la siguiente.',
          confirmar: e.compuerta ? 'Enviar a aprobación' : 'Completar',
          alConfirmar: function () {
            S.completarEtapa(p.id, n);
            U.aviso('Etapa actualizada', 'Etapa ' + n + ' de ' + p.id + '.', 'ok');
            window.setTimeout(recargar, 500);
          }
        });
      });
    });

    Array.prototype.forEach.call(cont.querySelectorAll('[data-aprobar],[data-devolver]'), function (b) {
      b.addEventListener('click', function () {
        var aprobar = b.hasAttribute('data-aprobar');
        var n = Number(b.getAttribute(aprobar ? 'data-aprobar' : 'data-devolver'));
        U.modal({
          titulo: (aprobar ? 'Aprobar' : 'Devolver') + ' la etapa ' + n,
          cuerpo: '<div class="campo"><label for="m-com">Comentario ' +
            (aprobar ? 'de aprobación' : 'de devolución') + ' <span class="req">*</span></label>' +
            '<textarea id="m-com" placeholder="' +
            (aprobar ? 'Deja constancia de la conformidad técnica.' : 'Explica qué falta o qué hay que corregir.') +
            '"></textarea><span class="ayuda">Obligatorio, mínimo 20 caracteres. Queda en la bitácora.</span>' +
            '<span class="error-txt oculto" id="m-err">Escribe al menos 20 caracteres.</span></div>' +
            (aprobar ? '<div class="aviso aviso-ok">' + U.icono('check_circle') +
              '<div><strong>Al aprobar se desbloquea la etapa ' + (n + 1) + '</strong>' +
              'El proyecto vuelve a estado En ejecución.</div></div>' : ''),
          confirmar: aprobar ? 'Aprobar etapa' : 'Devolver etapa',
          claseConfirmar: aprobar ? 'btn-primario' : 'btn-secundario',
          alConfirmar: function (caja, cerrar) {
            var txt = caja.querySelector('#m-com').value.trim();
            if (txt.length < 20) { caja.querySelector('#m-err').classList.remove('oculto'); return; }
            if (aprobar) S.aprobarEtapa(p.id, n, txt); else S.devolverEtapa(p.id, n, txt);
            cerrar();
            U.aviso(aprobar ? 'Etapa aprobada' : 'Etapa devuelta',
              aprobar ? 'Se desbloqueó la etapa ' + (n + 1) + '.' : 'El responsable debe corregir y reenviar.', 'ok');
            window.setTimeout(recargar, 600);
          }
        });
      });
    });
  }

  /* ======================================================================
     Pestaña 7: Equipo y honorarios
     ==================================================================== */
  function vistaEquipo() {
    var verTodos = A.puede('verHonorariosDeTodos');
    var verTotal = A.puede('verTotalHonorarios');
    var total = S.honorariosTotales(p);

    var nota = verTodos
      ? 'Ves el honorario de cada profesional porque tu rol lo permite.'
      : (rol === 'profesional'
          ? 'Ves el equipo completo, pero solo el monto de tu propio honorario. El resto aparece con un guion.'
          : 'Ves el total consolidado, no el desglose persona por persona.');

    var html = '<div class="aviso" style="margin-bottom:16px">' + U.icono('lock') +
      '<div><strong>Visibilidad de honorarios para ' + U.esc(A.nombreRol()) + '</strong>' + U.esc(nota) + '</div></div>';

    html += '<div class="tarjeta"><div class="tarjeta-cab"><h2>Equipo del proyecto</h2>' +
      '<div class="pi-acciones">' +
      '<span class="badge badge-neutro sin-punto">' + p.equipo.length + ' profesionales</span>' +
      (A.puede('asignarEquipo') ? '<button type="button" class="btn btn-sm btn-primario" id="b-asignar">' +
        U.icono('add', 'icono-sm') + ' Asignar profesional</button>' : '') +
      '</div></div>';

    if (!p.equipo.length) {
      html += U.vacio({ icono: 'groups', titulo: 'Sin equipo asignado', texto: 'Todavía no hay profesionales en este proyecto.' });
    } else {
      html += '<div class="tabla-envoltura"><table class="tabla responsiva"><thead><tr>' +
        '<th>Profesional</th><th>Rol en el proyecto</th><th>Especialidad</th>' +
        '<th class="num">Honorario</th><th class="derecha">Acción</th>' +
        '</tr></thead><tbody>';
      p.equipo.forEach(function (m) {
        var u = S.buscarUsuario(m.usuarioId);
        var esMio = m.usuarioId === yo.id;
        var monto;
        if (verTodos) monto = '<span class="mono">' + F.dinero(m.honorario) + '</span>';
        else if (rol === 'profesional' && esMio) monto = '<span class="mono" style="color:var(--primario);font-weight:700">' + F.dinero(m.honorario) + '</span>';
        else monto = '<span class="tenue">—</span>';
        html += '<tr' + (esMio ? ' style="background:var(--primario-tenue)"' : '') + '>' +
          '<td data-eti="Profesional"><div class="fila" style="gap:8px">' +
          '<span class="pi-avatar" style="width:28px;height:28px;font-size:11px">' + U.esc(F.iniciales(u ? u.nombre : '?')) + '</span>' +
          '<span><span class="principal">' + U.esc(u ? u.nombre : '—') + '</span>' +
          (esMio ? '<span class="sub" style="color:var(--primario);font-weight:600">tú</span>' : '') + '</span></div></td>' +
          '<td data-eti="Rol">' + U.esc(m.rolProyecto) + '</td>' +
          '<td data-eti="Especialidad" class="sm tenue">' + U.esc(u ? u.especialidad : '—') + '</td>' +
          '<td data-eti="Honorario" class="num">' + monto + '</td>' +
          '<td data-eti="" class="acciones">' +
          (A.puede('asignarEquipo') && m.usuarioId !== p.coordinadorId
            ? '<button type="button" class="btn btn-sm" data-quitar="' + m.usuarioId + '">Quitar</button>'
            : '<span class="sm tenue">—</span>') + '</td></tr>';
      });
      html += '</tbody></table></div>' +
        '<div class="tarjeta-pie"><span>Total de honorarios pactados</span>' +
        '<strong class="mono" style="margin-left:auto">' +
        (verTotal ? F.dinero(total) + ' USD' : '<span class="tenue">confidencial</span>') + '</strong></div>';
    }
    return html + '</div>';
  }

  function conectarEquipo() {
    var b = document.getElementById('b-asignar');
    if (b) b.addEventListener('click', function () {
      var libres = S.estado.usuarios.filter(function (u) {

    var resumen = S.resumenPorEspecie(p);

    var html = '<div class="aviso aviso-aviso" style="margin-bottom:16px">' + U.icono('warning') +
      '<div><strong>El volumen es captura manual</strong>' +
      'El sistema no calcula el volumen ni aplica ninguna ecuación de cubicación o factor de conversión. ' +
      'Registra el valor en metros cúbicos tal como lo determina el profesional en campo, y solo lo suma por especie.</div></div>';

    html += '<div class="kpis">' +
      U.kpi({ titulo: 'Parcelas medidas', icono: 'straighten', valor: F.numero(Object.keys(parcelas).length), pie: 'con al menos un registro' }) +
      U.kpi({ titulo: 'Registros', icono: 'table_chart', valor: F.numero(p.mediciones.length), pie: 'mediciones capturadas' }) +
      U.kpi({ titulo: 'Árboles', icono: 'forest', valor: F.numero(totalArb), pie: 'suma de individuos' }) +

      '</div><div style="height:24px"></div>';

    /* Formulario de captura */

      html += '<div class="tarjeta"><div class="tarjeta-cab"><h2>Capturar medición</h2></div>' +
        '<div class="tarjeta-cuerpo pila-sm">' +
        '<div class="campo"><label for="c-parcela">Finca o parcela <span class="req">*</span></label>' +

        '<span class="ayuda">Lista controlada. No se escribe a mano.</span></div>' +
        '<div class="rejilla rejilla-2">' +
        '<div class="campo"><label for="c-arboles">N.º de árboles</label>' +
        '<div class="campo-unidad"><input id="c-arboles" type="number" min="0" step="1" placeholder="0"><span class="unidad">ind</span></div></div>' +
        '<div class="campo"><label for="c-altura">Altura</label>' +
        '<div class="campo-unidad"><input id="c-altura" type="number" min="0" step="0.1" placeholder="0,0"><span class="unidad">m</span></div></div>' +
        '</div>' +
        '<div class="campo"><label for="c-dap">Diámetro a la altura del pecho</label>' +
        '<div class="campo-unidad"><input id="c-dap" type="number" min="0" step="0.1" placeholder="0,0"><span class="unidad">cm</span></div></div>' +

        '<span class="ayuda">Lo determina el profesional. El sistema no lo calcula.</span></div>' +
        '<button type="button" class="btn btn-primario" id="b-medir">' + U.icono('add') + ' Registrar medición</button>' +
        '</div></div>';
    } else {
      html += '<div class="tarjeta"><div class="tarjeta-cuerpo">' +
        U.vacio({ icono: 'lock', titulo: 'Solo lectura', texto: 'Tu rol puede consultar las mediciones, pero no capturarlas.' }) +
        '</div></div>';
    }

    /* Resumen por especie */
    html += '<div class="tarjeta"><div class="tarjeta-cab"><h2>Resumen por especie</h2>' +
      '<span class="badge badge-neutro sin-punto pi-acciones">suma de volúmenes capturados</span></div>';

      html += U.vacio({ icono: 'forest', titulo: 'Sin mediciones', texto: 'Captura la primera medición para ver el resumen.' });
    } else {
      html += '<div class="tabla-envoltura"><table class="tabla responsiva tabla-compacta"><thead><tr>' +
        '<th>Especie</th><th class="num">Parcelas</th><th class="num">Árboles</th>' +

        '<strong class="mono" style="margin-left:auto">' + F.numero(totalVol, 3) + ' m³</strong></div>';
    }
    html += '</div></div>';

    html += '<div style="height:24px"></div><div id="tabla-med"></div>';
    return html;
  }

    var cerrar = U.modal({
      titulo: 'Registrar movimiento financiero',
      cuerpo: '<div class="rejilla">' +
        '<div class="rejilla rejilla-2">' +
        '<div class="campo"><label for="m-tipo">Tipo <span class="req">*</span></label>' +
        '<select id="m-tipo">' + U.selectOpciones(cat.tiposMovimiento, 'Egreso') + '</select></div>' +
        '<div class="campo"><label for="m-monto">Monto <span class="req">*</span></label>' +
        '<div class="campo-unidad"><input id="m-monto" type="number" min="0" step="0.01" placeholder="0,00"><span class="unidad">USD</span></div></div>' +
        '</div>' +
        '<div class="campo"><label for="m-cat">Categoría <span class="req">*</span></label>' +
        '<select id="m-cat">' + U.selectOpciones(cats('Egreso'), '', 'Elige una categoría') + '</select>' +
        '<span class="ayuda">Lista controlada. Si intentas usar una categoría que no está en el catálogo, el sistema rechaza el movimiento.</span></div>' +
        '<div class="campo"><label for="m-concepto">Concepto <span class="req">*</span></label>' +
        '<textarea id="m-concepto" placeholder="Detalle de la partida"></textarea></div>' +
        '<div class="rejilla rejilla-2">' +
        '<div class="campo"><label for="m-estado">Estado <span class="req">*</span></label>' +
        '<select id="m-estado">' + U.selectOpciones(cat.estadosMovimiento, 'Por liquidar') + '</select></div>' +
        '<div class="campo"><label for="m-resp">Responsable</label>' +
        '<select id="m-resp">' + U.selectOpciones(
          S.estado.usuarios.filter(function (u) { return u.activo; }).map(function (u) { return { valor: u.id, texto: u.nombre }; }),
          S.usuario().id) + '</select></div>' +
        '</div></div>',
      confirmar: 'Registrar',
      alConfirmar: function (caja, cierra) {
        var tipo = caja.querySelector('#m-tipo').value;
        var mov = {
          tipo: tipo,
          categoria: caja.querySelector('#m-cat').value,
          concepto: caja.querySelector('#m-concepto').value.trim(),
          monto: caja.querySelector('#m-monto').value,
          estado: caja.querySelector('#m-estado').value,
          responsableId: caja.querySelector('#m-resp').value
        };
        if (!mov.categoria || !mov.concepto || !mov.monto) {
          U.aviso('Datos incompletos', 'Completa categoría, concepto y monto.', 'aviso'); return;
        }
        if (!S.agregarMovimiento(p.id, mov)) {
          U.aviso('Movimiento rechazado', 'La categoría o el estado no están en el catálogo.', 'mal'); return;
        }
        cierra(); U.aviso('Movimiento registrado', F.dinero(mov.monto) + ' USD en ' + mov.categoria + '.', 'ok');
        window.setTimeout(recargar, 500);
      }
    });
    /* Al cambiar el tipo cambian las categorías disponibles. */
    var selTipo = document.querySelector('#m-tipo'), selCat = document.querySelector('#m-cat');
    if (selTipo && selCat) {
      selTipo.addEventListener('change', function () {
        selCat.innerHTML = U.selectOpciones(cats(selTipo.value), '', 'Elige una categoría');
      });
    }
  }

  /* ======================================================================
     Pestaña 11: Bitácora del proyecto
     ==================================================================== */
  function vistaBitacora() {
    var logs = S.bitacoraDe(p.id);
    var html = '<div class="tarjeta"><div class="tarjeta-cab"><h2>Bitácora del proyecto</h2>' +
      '<span class="badge badge-neutro sin-punto pi-acciones">' + logs.length + ' registros</span></div>';
    if (!logs.length) {
      html += U.vacio({ icono: 'history_edu', titulo: 'Sin registros', texto: 'Todavía no hay movimientos registrados para este expediente.' });
    } else {
      html += '<div class="tarjeta-cuerpo"><div class="bitacora-lista">';
      logs.forEach(function (b) {
        html += '<div class="bitacora-item"><div><div class="cuando">' + U.esc(b.fechaHora) + '</div>' +
          '<div class="quien">' + U.esc(S.nombreUsuario(b.usuarioId)) + '</div></div>' +
          '<div><div class="accion">' + U.esc(S.etiquetaAccion(b.accion)) + '</div>' +
          '<div class="sm suave">' + U.esc(b.detalle) + '</div></div></div>';
      });
      html += '</div></div>';
    }
    return html + '</div>';
  }

  /* ======================================================================
     Montaje
     ==================================================================== */
  document.getElementById('pi-ficha').innerHTML = ficha();
  document.getElementById('pi-pestanas').innerHTML = barraPestanas();

  var vistas = {
    resumen: vistaResumen, etapas: vistaEtapas, equipo: vistaEquipo,
    documentos: vistaDocumentos, mediciones: vistaMediciones,
    finanzas: vistaFinanzas, bitacora: vistaBitacora
  };
  cont.innerHTML = (vistas[tab] || vistaResumen)();

  if (tab === 'etapas') conectarEtapas();
  if (tab === 'equipo') conectarEquipo();
  if (tab === 'documentos') conectarDocumentos();
  if (tab === 'mediciones') conectarMediciones();
  if (tab === 'finanzas') conectarFinanzas();
});
</script>
</body>
</html>
