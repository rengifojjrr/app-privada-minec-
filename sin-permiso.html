<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin permiso &middot; Beta &middot; Proyectos Integrales</title>
<meta name="description" content="Beta navegable del sistema de gestion de proyectos de Proyectos Integrales. Datos de ejemplo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%231F4D3D'/%3E%3Cpath d='M50 22l14 24-14-4-14 4z' fill='%23F7F6F2'/%3E%3Cpath d='M50 42l16 26-16-6-16 6z' fill='%23F7F6F2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<!-- seed, store y auth van en el head: la guarda de permisos debe correr
     ANTES de pintar. Si el rol no puede ver esta página, auth.js redirige. -->
<script src="assets/seed.js"></script>
<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
</head>
<body class="pi-verificando">
<main class="pi-portada">
  <div style="width:100%;max-width:620px" id="pi-contenido"></div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/shell.js"></script>
<script>

PI.listo(function () {
  var U = PI.ui, A = PI.auth, S = PI.store;
  var p = new URLSearchParams(window.location.search);
  var pagina = p.get('página') || '';
  var def = A.PAGINAS[pagina];
  var u = S.usuario();

  document.getElementById('pi-contenido').innerHTML =
    '<div class="tarjeta"><div class="tarjeta-cuerpo" style="text-align:center;padding:40px 24px">' +
    '<span style="display:inline-grid;place-items:center;width:64px;height:64px;border-radius:12px;' +
    'background:var(--error-tenue);color:var(--sobre-error-tenue);margin-bottom:16px">' +
    U.icono('lock', 'icono-xl') + '</span>' +
    '<div class="eti" style="color:var(--error)">Acceso restringido</div>' +
    '<h1 style="margin:4px 0 8px">Sin permiso para esta página</h1>' +
    '<p class="suave">Tu rol actual no tiene acceso a este modulo. Cambia de rol en la barra inferior ' +
    'o vuelve al panel de inicio.</p>' +
    '<div class="pozo" style="margin:24px 0;text-align:left">' +
    fila('Página solicitada', pagina || 'desconocida') +
    fila('Título del módulo', def ? def.titulo : 'no registrado') +
    fila('Identidad activa', u ? u.nombre : '—') +
    fila('Rol asignado', A.nombreRol()) +
    fila('Roles con acceso', def ? def.roles.map(function (r) { return A.nombreRol(r); }).join(', ') : '—') +
    '</div>' +
    '<div class="pi-acciones" style="justify-content:center">' +
    '<a class="btn btn-primario" href="' + A.inicioDe(A.rol()) + '">' + U.icono('dashboard') + ' Ir al panel de inicio</a>' +
    '<a class="btn btn-borde" href="index.html">' + U.icono('person') + ' Cambiar de rol</a>' +
    '</div></div></div>';

  function fila(k, v) {
    return '<div style="display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--borde-fino)">' +
      '<span class="eti" style="min-width:160px">' + U.esc(k) + '</span>' +
      '<span class="mono">' + U.esc(v) + '</span></div>';
  }
});
</script>
</body>
</html>
