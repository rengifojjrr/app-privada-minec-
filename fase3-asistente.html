<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de informes &middot; Beta &middot; MONPICA</title>
<meta name="description" content="Beta navegable del sistema de gestión de proyectos de MONPICA — Montilla Proyectos Integrales C.A. Datos de ejemplo.">
<link rel="icon" type="image/png" href="assets/marca/favicon.png">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<!-- seed, store y auth van en el head: la guarda de permisos debe correr
     ANTES de pintar. Si el rol no puede ver esta pagina, auth.js redirige. -->
<script src="assets/seed.js"></script>
<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
</head>
<body class="pi-verificando">
<main class="pi-lienzo">
  <div id="pi-cabecera"></div>
  <div id="pi-aviso"></div>
  <div id="pi-contenido"></div>
</main>
<script src="assets/icons.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/demo.js"></script>
<script src="assets/shell.js"></script>
<script>

PI.listo(function () {
  var U = PI.ui;
  document.getElementById('pi-cabecera').innerHTML = PI.shell.cabecera({
    kicker: 'Fase 3 · hoja de ruta',
    titulo: 'Asistente de informes',
    texto: 'Un apoyo para redactar los informes a partir de lo que ya está capturado en el sistema. Aquí solo se muestra la forma que tendría.',
    acciones: '<span class="badge badge-aviso sin-punto">Maqueta sin funcionamiento</span>'
  });

  document.getElementById('pi-aviso').innerHTML =
    '<div class="aviso aviso-aviso" style="margin-bottom:24px">' + U.icono('warning') +
    '<div><strong>Esta pantalla no funciona y es a propósito</strong>Es la maqueta de una fase futura: muestra la forma que tendría el asistente, no su funcionamiento. Los botones están deshabilitados. Si algún día se construye, seguirá sin calcular el volumen de madera.</div></div>';

  var BLOQUES = [
      { icono: 'description', titulo: 'Borrador desde los datos capturados', accion: 'Generar borrador',
        texto: 'Tomaría las mediciones, el equipo y las etapas ya registradas para armar la estructura del informe.',
        puntos: ['Estructura y tablas a partir del expediente', 'Nunca inventa cifras que no estén capturadas',
                 'El volumen se copia tal cual: sigue sin calcularse'] },
      { icono: 'table_chart', titulo: 'Tablas y anexos', accion: 'Armar anexos',
        texto: 'Las tablas de campo y los cuadros financieros saldrían del sistema, ya formateados.',
        puntos: ['Resumen por especie y por parcela', 'Cuadros de ejecución presupuestaria',
                 'Numeración y referencias automáticas'], marcador: 'Vista previa del documento' },
      { icono: 'verified', titulo: 'Revisión humana obligatoria', accion: 'Enviar a revisión',
        texto: 'El borrador nunca sería el informe final: pasaría por el Coordinador antes de salir.',
        puntos: ['El profesional responsable firma el contenido', 'Queda registro en la bitácora de quién revisó',
                 'La responsabilidad técnica no se delega al asistente'] },
      { icono: 'science', titulo: 'Lo que no haría', accion: 'Ver límites',
        texto: 'Conviene fijar los límites antes de construirlo, no después.',
        puntos: ['No calcula volúmenes ni aplica ecuaciones de cubicación',
                 'No decide aprobaciones ni cierra etapas',
                 'No consulta fuentes externas sin autorización'] }
    ];

  document.getElementById('pi-contenido').innerHTML =
    '<div class="rejilla rejilla-2">' + BLOQUES.map(function (b) {
      return '<div class="tarjeta maqueta"><div class="tarjeta-cab">' + U.icono(b.icono) +
        '<h3 style="flex:1">' + U.esc(b.titulo) + '</h3></div>' +
        '<div class="tarjeta-cuerpo maqueta-cuerpo">' +
        '<p class="sm suave">' + U.esc(b.texto) + '</p>' +
        '<ul class="sm suave" style="margin:10px 0 0;padding-left:18px">' +
        b.puntos.map(function (p) { return '<li>' + U.esc(p) + '</li>'; }).join('') + '</ul>' +
        (b.marcador ? '<div style="margin-top:12px">' + U.marcador(b.marcador, 110) + '</div>' : '') +
        '</div><div class="pi-modal-pie">' +
        '<button type="button" class="btn" disabled>' + U.esc(b.accion) + '</button></div></div>';
    }).join('') + '</div>';
});
</script>
</body>
</html>
